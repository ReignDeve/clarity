# Generated by Nexus ReleaseHub – builds and uploads a release for every pushed version tag (v1.2.3).
# Requires the repository secret NEXUS_TOKEN (a project-scoped Nexus API token).
name: Nexus Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  NEXUS_URL: "https://nexus.cloud.jonasbl.de"
  NEXUS_ORG: "aevar"
  NEXUS_PROJECT: "clarity"

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - name: Linux dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Build
        run: npm run tauri build
      - name: Upload to Nexus
        shell: bash
        env:
          NEXUS_TOKEN: ${{ secrets.NEXUS_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          curl -fsSL "$NEXUS_URL/cli/nexus.mjs" -o "$RUNNER_TEMP/nexus.mjs"
          node "$RUNNER_TEMP/nexus.mjs" release create "$VERSION" --if-not-exists --source ci --channel "stable"
          node "$RUNNER_TEMP/nexus.mjs" upload "$VERSION" "src-tauri/target/release/bundle/**/*"

  publish:
    name: Changelog & publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Changelog & publish
        shell: bash
        env:
          NEXUS_TOKEN: ${{ secrets.NEXUS_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          curl -fsSL "$NEXUS_URL/cli/nexus.mjs" -o "$RUNNER_TEMP/nexus.mjs"
          node "$RUNNER_TEMP/nexus.mjs" changelog generate "$VERSION" --apply --if-empty
          node "$RUNNER_TEMP/nexus.mjs" release publish "$VERSION"
