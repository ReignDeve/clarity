# Runs all tests on every push to main, so problems show up before a release.
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          pnpm typecheck
          pnpm test
          cargo test --manifest-path src-tauri/Cargo.toml --no-fail-fast 2>&1 | tee "$RUNNER_TEMP/cargo-test.log" || {
            grep -E "^test .* FAILED|panicked at|^error(\[|:)|assertion" "$RUNNER_TEMP/cargo-test.log" | head -30 | sed 's/^/::error::/'
            exit 1
          }
